[project]
name = "imie-core"
version = "0.4.0"
description = "Institutional Market Intelligence Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.43.5",
    "python-dotenv>=1.2.2",
    "requests>=2.30.0",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
]

[project.scripts]
imie-runtime = "imie.runtime_cli:main"
imie-reconcile = "imie.reconcile_cli:main"
imie-position-reconcile = "imie.position_reconcile_cli:main"
imie-position-protect = "imie.position_protect_cli:main"
imie-position-protection-status = "imie.position_protection_status_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
