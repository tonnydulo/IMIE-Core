name: CI

on:
  push:
    branches:
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on Windows
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install IMIE Core
        run: python -m pip install -e ".[test]"

      - name: Check dependency integrity
        run: python -m pip check

      - name: Run test suite
        run: python -W error::DeprecationWarning -m pytest

  package:
    name: Build and install package
    runs-on: windows-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Create clean smoke environment
        shell: pwsh
        run: |
          python -m venv smoke-venv
          .\smoke-venv\Scripts\python.exe -m pip install --upgrade pip

          $wheel = Get-ChildItem dist\*.whl |
              Select-Object -First 1

          if ($null -eq $wheel) {
              throw "No wheel was produced."
          }

          .\smoke-venv\Scripts\python.exe -m pip install $wheel.FullName
          .\smoke-venv\Scripts\python.exe -m pip check

      - name: Smoke-test installed command
        shell: pwsh
        run: |
          .\smoke-venv\Scripts\imie-runtime.exe `
              --provider mock `
              --no-history `
              --no-health-history
