name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build GitHub release
    runs-on: windows-latest

    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install release tools
        run: python -m pip install --upgrade pip build twine

      - name: Validate tag and package versions
        shell: pwsh
        run: |
          $tagVersion = $env:RELEASE_TAG -replace '^v', ''

          $packageVersion = python -c `
              "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"

          $runtimeVersion = python -c `
              "exec(open('src/imie/version.py').read()); print(IMIE_VERSION)"

          Write-Host "Release tag version : $tagVersion"
          Write-Host "Package version     : $packageVersion"
          Write-Host "Runtime version     : $runtimeVersion"

          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
              throw "Release tag must use the format vMAJOR.MINOR.PATCH."
          }

          if ($packageVersion -ne $tagVersion) {
              throw "pyproject.toml version does not match the release tag."
          }

          if ($runtimeVersion -ne $tagVersion) {
              throw "IMIE_VERSION does not match the release tag."
          }

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: IMIE Core ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
